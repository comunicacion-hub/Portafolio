<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1fb">
<title>Encuesta — Redes Con Rostro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="resp-body">

<!-- Página pública para responder una encuesta: sin login ni navegación.
     Se abre con ?id=<encuesta> o con ?c=<código corto>. Los enlaces que se
     comparten son encuestas.redesconrostro.org/<código>, que muestra esta
     página dentro de un marco (repositorio comunicacion-hub/encuestas); los
     viejos /e/?código siguen funcionando.
     Lee Encuestas/{id} y guarda la respuesta en Encuestas/{id}/Respuestas.
     · Cada sección es un paso (tarjeta) con Atrás / Continuar.
     · Funciona sin conexión después de abrirla una vez con internet:
       la página queda guardada (sw-encuestas.js) y las respuestas esperan en
       el teléfono hasta que vuelve la conexión (persistencia de Firestore).
     · Fotos: con Google Drive configurado (ENC.DRIVE_URL) suben a Drive;
       ver "Fotos a Google Drive" más abajo. -->
<div class="rg-fondo" aria-hidden="true"></div>
<div class="resp-wrap">
  <!-- Aviso cuando no hay internet -->
  <div class="rg-aviso" id="rg-aviso" role="status" hidden>
    <span class="rg-aviso-ico" id="rg-aviso-ico"></span>
    <span><strong>Sin conexión.</strong> Puedes seguir respondiendo: las respuestas se enviarán automáticamente cuando haya conexión.</span>
  </div>
  <div id="resp-app" aria-busy="true"></div>
  <div class="resp-foot">Redes Con Rostro</div>
</div>

<!-- Ícono flotante: respuestas guardadas en este teléfono que faltan enviar -->
<button type="button" class="rg-cola" id="rg-cola" hidden aria-live="polite">
  <span class="rg-cola-ico" id="rg-cola-ico"></span>
  <span class="rg-cola-n" id="rg-cola-n">0</span>
</button>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebase (solo Firestore; responder no requiere iniciar sesión) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* RCR mínimo: encuestas.js solo necesita esc() de él */
window.RCR = { modulos: {} };
RCR.esc = function (v) {
  var d = document.createElement('div');
  d.textContent = (v == null) ? '' : String(v);
  return d.innerHTML;
};
</script>
<script src="icons.js"></script>
<script src="encuestas.js"></script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var previa = params.get('previa') === '1';
  var app = document.getElementById('resp-app');
  var enc = null, db = null, enviando = false, persistente = false;
  var fotos = {};          // { idPregunta: { ver, hq?, mini? } } de las preguntas "Subir imagen"
  var pags = [];           // [{ sec: Sección|null, items: [Pregunta] }]
  var pagAct = 0;

  /* ── Avisos breves ────────────────────────────────────────────────────── */
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  /* Mensaje a pantalla completa (gracias, guardada, encuesta cerrada…):
     sin tarjeta y centrado en la pantalla */
  function estado(icono, titulo, texto, extra, clase) {
    app.removeAttribute('aria-busy');
    app.className = 'con-estado';
    app.innerHTML =
      '<div class="resp-estado ' + (clase || '') + '">' +
        '<div class="resp-estado-ico">' + ico(icono, 28, 2.2) + '</div>' +
        '<h2>' + RCR.esc(titulo) + '</h2>' +
        (texto ? '<p>' + RCR.esc(texto) + '</p>' : '') +
        (extra || '') +
      '</div>';
    pintarRed();
  }

  /* ── Fotos (preguntas "Subir imagen") ─────────────────────────────────── */
  function pintarFoto(qid) {
    var box = document.getElementById('rf-' + qid);
    if (!box) return;
    var url = fotos[qid] && fotos[qid].ver;
    var lbl = box.querySelector('.resp-subir');
    var prev = box.querySelector('.resp-foto-prev');
    if (prev) prev.remove();
    lbl.classList.toggle('hidden', !!url);
    if (url) {
      box.insertAdjacentHTML('afterbegin',
        '<div class="resp-foto-prev"><img src="' + url + '" alt="Foto elegida">' +
          '<button type="button" class="resp-foto-quitar" data-q="' + qid + '" onclick="window.__quitarFoto(this.dataset.q)">' + ico('x', 14, 2.6) + 'Quitar</button>' +
        '</div>');
    }
  }

  window.__elegirFoto = function (qid, input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    /* Con Drive: la foto para Drive y una copia chica para la respuesta;
       sin Drive: una sola, dentro de la respuesta (como antes) */
    var tam = ENC.DRIVE_URL ? [ENC.IMG_DRIVE, ENC.IMG_MINI] : [ENC.IMG_RESP];
    ENC.comprimirImagen(file, tam).then(function (u) {
      fotos[qid] = u.length === 2 ? { ver: u[1], hq: u[0], mini: u[1] } : { ver: u[0] };
      pintarFoto(qid);
      limpiarError(document.getElementById('rq-' + qid));
      actualizar();
    }).catch(function () { toast('Elige un archivo de imagen (JPG o PNG)'); });
  };

  window.__quitarFoto = function (qid) {
    delete fotos[qid];
    pintarFoto(qid);
    actualizar();
  };

  /* ── HTML de cada pregunta ────────────────────────────────────────────── */
  function preguntaHtml(q) {
    var name = 'q_' + q.id, campo = '';
    var a = ENC.attr;

    if (ENC.esSeccion(q)) {
      return '<div class="resp-sec" id="rq-' + q.id + '">' +
        '<h2>' + RCR.esc(q.texto) + '</h2>' +
        (q.descripcion ? '<p>' + RCR.esc(q.descripcion) + '</p>' : '') +
        ENC.apoyoPublico(q) +
      '</div>';
    }

    if (q.tipo === 'numero') {
      campo = '<input class="rg-campo resp-numero" name="' + name + '" inputmode="decimal" autocomplete="off" maxlength="30" placeholder="Escribe un número">';
    } else if (q.tipo === 'imagen') {
      campo = '<div class="resp-foto" id="rf-' + q.id + '">' +
        '<label class="resp-subir">' +
          '<input type="file" accept="image/*" class="sr-only" data-q="' + q.id + '" onchange="window.__elegirFoto(this.dataset.q, this)">' +
          '<span class="resp-subir-ico">' + ico('image', 22) + '</span>' +
          '<span><strong>Subir una foto</strong><small>JPG o PNG · también puedes tomarla con el celular</small></span>' +
        '</label>' +
      '</div>';
    } else if (q.tipo === 'cuadricula') {
      var cols = q.columnas || [];
      campo = '<div class="resp-grid" style="--cols:' + cols.length + '">' +
        '<div class="resp-grid-cab" aria-hidden="true"><span></span>' +
          cols.map(function (c) { return '<span>' + RCR.esc(c) + '</span>'; }).join('') + '</div>' +
        (q.filas || []).map(function (f) {
          return '<div class="resp-grid-fila" role="radiogroup" aria-label="' + a(f.t) + '">' +
            '<div class="resp-grid-lbl">' + RCR.esc(f.t) + '</div>' +
            '<div class="resp-grid-celdas">' +
            cols.map(function (c) {
              return '<label class="resp-grid-celda"><input type="radio" name="' + name + '_' + a(f.id) + '" value="' + a(c) + '" aria-label="' + a(f.t + ': ' + c) + '">' +
                '<span class="resp-marca"></span><span class="resp-grid-col">' + RCR.esc(c) + '</span></label>';
            }).join('') +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    } else if (q.tipo === 'corto') {
      campo = '<input class="rg-campo" name="' + name + '" maxlength="500" placeholder="Tu respuesta" autocomplete="off">';
    } else if (q.tipo === 'largo') {
      campo = '<textarea class="rg-campo" name="' + name + '" rows="4" maxlength="5000" placeholder="Tu respuesta"></textarea>';
    } else if (q.tipo === 'unica' || q.tipo === 'multiple') {
      var tipoInput = q.tipo === 'multiple' ? 'checkbox' : 'radio';
      campo = '<div class="resp-opciones">' + (q.opciones || []).map(function (o) {
        return '<label class="resp-opcion"><input type="' + tipoInput + '" name="' + name + '" value="' + a(o) + '">' +
                 '<span class="resp-marca ' + (q.tipo === 'multiple' ? 'cuadro' : '') + '"></span>' +
                 '<span class="resp-opcion-txt">' + RCR.esc(o) + '</span></label>';
      }).join('') + '</div>' +
      (q.tipo === 'multiple'
        ? '<div class="resp-ayuda" id="ra-' + q.id + '">' +
            (ENC.maxValido(q) ? 'Puedes elegir hasta ' + ENC.maxValido(q) + (ENC.maxValido(q) === 1 ? ' opción.' : ' opciones.') : 'Puedes elegir varias.') +
          '</div>'
        : '');
    } else if (q.tipo === 'escala') {
      campo = '<div class="rg-seg resp-escala">' + [1, 2, 3, 4, 5].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>' +
      '<div class="resp-escala-ext"><span>Bajo</span><span>Alto</span></div>';
    } else if (q.tipo === 'estrellas') {
      /* Cinco estrellas: se pintan hasta la elegida (y al pasar el cursor) */
      campo = '<div class="resp-estrellas" role="radiogroup" aria-label="' + a('Calificación de 1 a 5 estrellas') + '">' +
        [1, 2, 3, 4, 5].map(function (v) {
          return '<label class="resp-estr" title="' + v + (v === 1 ? ' estrella' : ' estrellas') + '">' +
            '<input type="radio" name="' + name + '" value="' + v + '" aria-label="' + v + (v === 1 ? ' estrella' : ' estrellas') + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>' +
          '</label>';
        }).join('') +
      '</div>';
    } else if (q.tipo === 'sino') {
      campo = '<div class="rg-seg resp-sino">' + ['Sí', 'No'].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>';
    }

    return '' +
      '<fieldset class="resp-q" id="rq-' + q.id + '" data-id="' + q.id + '">' +
        '<legend class="resp-q-txt"><span class="resp-q-n"></span><span class="resp-q-t">' + RCR.esc(q.texto) +
          (q.requerida ? ' <span class="resp-req" aria-label="obligatoria">*</span>' : '') + '</span></legend>' +
        ENC.apoyoPublico(q) +
        campo +
        '<div class="resp-err" role="alert"></div>' +
      '</fieldset>';
  }

  /* ── Pasos: cada sección es una tarjeta; lo que va antes de la primera
     sección forma el primer paso, junto con la bienvenida. ─────────────── */
  function armarPaginas(ps) {
    var out = [], act = { sec: null, items: [] };
    ps.forEach(function (q) {
      if (ENC.esSeccion(q)) {
        if (act.sec || act.items.length) out.push(act);
        act = { sec: q, items: [] };
      } else act.items.push(q);
    });
    if (act.sec || act.items.length) out.push(act);
    return out;
  }

  /* Pasos que se ven según las respuestas (una sección con condición que no
     se cumple, o sin ninguna pregunta visible, se salta) */
  function pagVisibles(vis) {
    return pags.map(function (p, k) { return k; }).filter(function (k) {
      var p = pags[k];
      if (k === 0) return true;
      if (p.sec && !vis[p.sec.id]) return false;
      return p.items.some(function (q) { return vis[q.id]; });
    });
  }

  function pintar() {
    app.removeAttribute('aria-busy');
    app.className = '';
    var ps = enc.preguntas || [];
    pags = armarPaginas(ps);
    var varias = pags.length > 1;

    /* Sin tarjeta de bienvenida: el título va solo en la barra de arriba */
    app.innerHTML =
      (previa ? '<div class="resp-previa">' + ico('eye', 16) + '<span>Vista previa: las respuestas no se guardan.</span></div>' : '') +
      '<div class="rg-barra" id="rg-barra">' +
        '<span class="rg-barra-tit">' + RCR.esc(enc.titulo || 'Encuesta') + '</span>' +
        (varias ? '<span class="rg-paso" id="rg-paso"></span>' : '') +
        (varias ? '<div class="rg-prog" aria-hidden="true"><i id="rg-prog-fill"></i></div>' : '') +
      '</div>' +
      '<form id="resp-form" novalidate>' +
        pags.map(function (p, k) {
          return '<section class="rg-pag" data-p="' + k + '"' + (k ? ' hidden' : '') + '>' +
            (p.sec ? preguntaHtml(p.sec) : '') +
            p.items.map(preguntaHtml).join('') +
          '</section>';
        }).join('') +
        '<div class="rg-nav">' +
          '<button type="button" class="rg-btn rg-btn-sec" id="rg-atras" hidden>' + ico('chevronLeft', 18, 2.4) + '<span>Atrás</span></button>' +
          '<button type="submit" class="rg-btn rg-btn-pri" id="resp-enviar"><span>Continuar</span>' + ico('chevronRight', 18, 2.4) + '</button>' +
        '</div>' +
      '</form>';

    var form = document.getElementById('resp-form');
    form.addEventListener('change', function () { pintarProgreso(); });
    form.addEventListener('input', function (e) { limpiarError(e.target.closest('.resp-q')); });
    form.addEventListener('submit', function (e) { e.preventDefault(); continuar(); });
    document.getElementById('rg-atras').addEventListener('click', atras);
    actualizar();
    irA(0, 0);
    pintarRed();
  }

  /* ── Navegación entre pasos ───────────────────────────────────────────── */
  function irA(k, dir) {
    var st = actualizar();
    var vs = pagVisibles(st.vis);
    pagAct = k;
    document.querySelectorAll('.rg-pag').forEach(function (s) {
      var esta = +s.dataset.p === k;
      s.hidden = !esta;
      s.classList.remove('entra-der', 'entra-izq');
      if (esta && dir) { void s.offsetWidth; s.classList.add(dir > 0 ? 'entra-der' : 'entra-izq'); }
    });
    pintarProgreso(vs);
    if (dir) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Paso actual, barra de progreso y botones (cambian si una respuesta
     muestra u oculta una sección) */
  function pintarProgreso(vs) {
    vs = vs || pagVisibles(actualizar().vis);
    var pos = Math.max(0, vs.indexOf(pagAct)), total = vs.length, ultimo = pos === total - 1;
    var paso = document.getElementById('rg-paso');
    if (paso) paso.textContent = 'Paso ' + (pos + 1) + ' de ' + total;
    var fill = document.getElementById('rg-prog-fill');
    if (fill) fill.style.width = Math.round((pos + 1) / total * 100) + '%';
    document.getElementById('rg-atras').hidden = pos <= 0;
    var btn = document.getElementById('resp-enviar');
    if (btn.disabled) return;
    btn.classList.toggle('final', ultimo);
    btn.innerHTML = ultimo
      ? '<span>' + (previa ? 'Terminar vista previa' : 'Enviar respuestas') + '</span>' + ico('check', 18, 2.6)
      : '<span>Continuar</span>' + ico('chevronRight', 18, 2.4);
  }

  function continuar() {
    if (enviando) return;
    var st = actualizar();
    var pag = pags[pagAct];
    var err = validar(pag.items, st);
    if (err) { mostrarError(err); return; }
    var vs = pagVisibles(st.vis);
    var siguientes = vs.filter(function (k) { return k > pagAct; });
    if (siguientes.length) irA(siguientes[0], 1);
    else enviar(st);
  }

  function atras() {
    var vs = pagVisibles(actualizar().vis);
    var antes = vs.filter(function (k) { return k < pagAct; });
    if (antes.length) irA(antes[antes.length - 1], -1);
  }

  /* ── Leer respuestas y aplicar la lógica condicional ──────────────────── */
  function leer() {
    var form = document.getElementById('resp-form'), r = {};
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      var name = 'q_' + q.id;
      if (q.tipo === 'corto' || q.tipo === 'largo' || q.tipo === 'numero') {
        var el = form.elements[name];
        r[q.id] = el ? el.value.trim() : '';
      } else if (q.tipo === 'imagen') {
        r[q.id] = fotos[q.id] ? fotos[q.id].ver : '';
      } else if (q.tipo === 'cuadricula') {
        var g = {};
        (q.filas || []).forEach(function (f) {
          var m = form.querySelector('input[name="' + name + '_' + f.id + '"]:checked');
          if (m) g[f.id] = m.value;
        });
        r[q.id] = g;
      } else if (q.tipo === 'multiple') {
        r[q.id] = Array.prototype.slice.call(form.querySelectorAll('input[name="' + name + '"]:checked'))
          .map(function (x) { return x.value; });
      } else {
        var sel = form.querySelector('input[name="' + name + '"]:checked');
        r[q.id] = sel ? ((q.tipo === 'escala' || q.tipo === 'estrellas') ? Number(sel.value) : sel.value) : '';
      }
    });
    return r;
  }

  function vacio(v) {
    return v == null || v === '' || (Array.isArray(v) && !v.length) ||
      (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
  }

  function actualizar() {
    var r = leer();
    var vis = ENC.visibles(enc.preguntas, r);
    var n = 0;
    (enc.preguntas || []).forEach(function (q) {
      var fs = document.getElementById('rq-' + q.id);
      if (!fs) return;
      var ver = !!vis[q.id];
      fs.classList.toggle('hidden', !ver);
      if (ENC.esSeccion(q)) return;
      fs.disabled = !ver;
      if (ver) fs.querySelector('.resp-q-n').textContent = ++n;
      /* Opción múltiple con tope: al llegar al máximo se bloquean las demás */
      var max = ENC.maxValido(q);
      if (max) {
        var lleno = (r[q.id] || []).length >= max;
        fs.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.disabled = lleno && !cb.checked;
          cb.closest('.resp-opcion').classList.toggle('bloqueada', cb.disabled);
        });
        var ay = document.getElementById('ra-' + q.id);
        if (ay) ay.textContent = lleno
          ? 'Ya elegiste ' + max + (max === 1 ? ' opción' : ' opciones') + '. Quita una para cambiarla.'
          : 'Puedes elegir hasta ' + max + (max === 1 ? ' opción.' : ' opciones.');
      }
    });
    return { r: r, vis: vis };
  }

  /* ── Validación (de un paso o de todo) ────────────────────────────────── */
  function limpiarError(fs) {
    if (!fs || !fs.classList.contains('con-error')) return;
    fs.classList.remove('con-error');
    fs.querySelector('.resp-err').textContent = '';
  }

  function validar(qs, st) {
    var primero = null;
    qs.forEach(function (q) {
      if (ENC.esSeccion(q)) return;
      var fs = document.getElementById('rq-' + q.id);
      if (!fs) return;
      var v = st.vis[q.id], r = st.r[q.id];
      var falta = v && q.requerida && vacio(r);
      var malNum = v && q.tipo === 'numero' && !vacio(r) && isNaN(ENC.leerNumero(r));
      var max = ENC.maxValido(q);
      var demas = v && max && (r || []).length > max;
      var faltaFila = v && q.requerida && q.tipo === 'cuadricula' && !falta &&
        Object.keys(r || {}).length < (q.filas || []).length;
      var msg = falta ? 'Esta pregunta es obligatoria'
        : (faltaFila ? 'Responde todas las filas'
        : (malNum ? 'Escribe solo un número (por ejemplo 12 o 3,5)'
        : (demas ? 'Elige como máximo ' + max : '')));
      fs.classList.toggle('con-error', !!msg);
      fs.querySelector('.resp-err').innerHTML = msg ? ico('alert', 14) + '<span>' + RCR.esc(msg) + '</span>' : '';
      if (msg && !primero) primero = fs;
    });
    return primero;
  }

  /* El mensaje en rojo bajo la pregunta ya explica qué falta: sin aviso extra */
  function mostrarError(fs) {
    fs.scrollIntoView({ behavior: 'smooth', block: 'center' });
    fs.classList.remove('sacude'); void fs.offsetWidth; fs.classList.add('sacude');
  }

  /* ── Enviar (también sin conexión) ────────────────────────────────────── */
  var CLAVE_PEND = 'rcr-enc-pend-';
  var enCola = {};   // respuestas de esta visita que quedaron esperando conexión
  function pendientes() {
    try { return JSON.parse(localStorage.getItem(CLAVE_PEND + id) || '[]'); } catch (e) { return []; }
  }
  function guardarPend(lista) {
    try {
      if (lista.length) localStorage.setItem(CLAVE_PEND + id, JSON.stringify(lista));
      else localStorage.removeItem(CLAVE_PEND + id);
    } catch (e) { /* sin almacenamiento: solo se pierde el contador */ }
    pintarRed();
  }

  async function enviar(st) {
    if (enviando) return;
    /* Revisión final de todo (por si algo quedó en un paso anterior) */
    var err = validar(ENC.soloPreguntas(enc.preguntas), st);
    if (err) {
      var k = pags.findIndex(function (p) { return p.items.some(function (q) { return 'rq-' + q.id === err.id; }); });
      if (k >= 0 && k !== pagAct) irA(k, -1);
      setTimeout(function () { mostrarError(err); }, 60);
      return;
    }

    /* Solo se guardan las preguntas visibles y respondidas. Las fotos para
       Drive van aparte (aDrive); en la respuesta queda su copia chica. */
    var respuestas = {}, aDrive = {}, etiqueta = '';
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      if (!st.vis[q.id] || vacio(st.r[q.id])) return;
      /* Primera respuesta de texto corto (suele ser el nombre): va en el
         nombre de la foto en Drive, para saber de quién es */
      if (q.tipo === 'corto' && !etiqueta) etiqueta = String(st.r[q.id]).trim().slice(0, 60);
      var f = q.tipo === 'imagen' ? fotos[q.id] : null;
      if (f && f.hq) {
        aDrive[q.id] = { hq: f.hq, mini: f.mini };
        respuestas[q.id] = f.mini;                    // para medir el tamaño final
      } else {
        respuestas[q.id] = q.tipo === 'numero' ? ENC.leerNumero(st.r[q.id]) : st.r[q.id];
      }
    });
    if (JSON.stringify(respuestas).length > ENC.LIMITE_DOC) {
      toast('Las fotos pesan demasiado. Quita alguna e inténtalo de nuevo.');
      return;
    }

    if (previa) { gracias('previa'); return; }

    enviando = true;
    var btn = document.getElementById('resp-enviar');
    btn.disabled = true; btn.innerHTML = '<span>Enviando…</span>';

    var ref = db.collection(ENC.COL).doc(id).collection(ENC.SUB_RESP).doc();
    var espera = navigator.onLine ? 9000 : 700;
    try {
      var res;
      if (Object.keys(aDrive).length) {
        Object.keys(aDrive).forEach(function (k) { delete respuestas[k]; });
        res = await enviarConFotos({ rid: ref.id, enc: id, fecha: Date.now(), etiqueta: etiqueta, respuestas: respuestas, fotos: aDrive }, espera);
      } else {
        var escritura = guardarRespuesta(ref, respuestas, id);
        res = await Promise.race([escritura.then(function () { return 'ok'; }), esperar(espera, 'cola')]);
        if (res === 'cola') enCola[ref.id] = true;
      }
      gracias(res);
    } catch (e) {
      toast('No se pudo enviar: la encuesta puede estar cerrada. Inténtalo de nuevo.');
      btn.disabled = false;
      pintarProgreso();
    }
    enviando = false;
  }

  /* Guarda una respuesta. Queda en la cola de Firestore (en el teléfono)
     aunque no haya internet y se envía sola cuando vuelve la conexión. Las
     de otra encuesta (cola de fotos) no entran en el contador de esta. */
  function guardarRespuesta(ref, respuestas, encId) {
    var propia = encId === id;
    var escritura = ref.set({ respuestas: respuestas, enviado: firebase.firestore.FieldValue.serverTimestamp() });
    if (propia) guardarPend(pendientes().concat([ref.id]));
    escritura.then(function () {
      if (propia) guardarPend(pendientes().filter(function (x) { return x !== ref.id; }));
      /* Si había quedado en cola y ya no falta ninguna, se avisa */
      if (enCola[ref.id]) {
        delete enCola[ref.id];
        avisarListo();
      }
    }, function (e) {
      console.error('responder-encuesta:', e);
      if (propia) guardarPend(pendientes().filter(function (x) { return x !== ref.id; }));
    });
    return escritura;
  }
  /* Se cuenta de nuevo lo que espera fotos (un momento después, cuando ya
     salió de la cola) antes de decir que se envió todo */
  function avisarListo() {
    setTimeout(function () {
      colaTodas().then(function (l) {
        var n = l.filter(function (x) { return x.enc === id; }).length;
        if (!n && !Object.keys(enCola).length && !pendientes().length) toast('Listo: se enviaron las respuestas guardadas');
      });
    }, 400);
  }

  /* ── Fotos a Google Drive ─────────────────────────────────────────────────
     La respuesta con fotos espera en el teléfono (IndexedDB, base
     "rcr-enc-fotos") hasta que sus fotos suben a Drive; recién entonces se
     guarda en Firestore con { drive, mini, carpeta } en cada foto. Así
     funciona también sin conexión: se envía sola cuando vuelve internet con
     la página abierta, o la próxima vez que se abra.
     · Cada foto sube una sola vez: lo que ya subió queda anotado.
     · Si Drive rechaza una foto (encuesta cerrada, pregunta borrada…) o
       falla 4 veces con conexión, la respuesta se guarda con la copia chica.
     · Sin conexión, o si Drive no responde, se reintenta cada vez más
       espaciado (30 s, 1 min, 2 min… hasta 10 min). */
  var COLA_BD = 'rcr-enc-fotos';
  var colaBD = null, colaMem = {}, colaN = 0, colaTotal = 0;
  var subiendo = false, oyentes = {}, proximoIntento = 0, pausaCola = 30000;

  function abrirCola() {
    if (colaBD !== null) return Promise.resolve(colaBD);
    return Promise.race([
      new Promise(function (ok) {
        try {
          var rq = indexedDB.open(COLA_BD, 1);
          rq.onupgradeneeded = function () { rq.result.createObjectStore('cola', { keyPath: 'rid' }); };
          rq.onsuccess = function () { ok(rq.result); };
          rq.onerror = rq.onblocked = function () { ok(false); };
        } catch (e) { ok(false); }
      }),
      esperar(2500, false)                            // almacenamiento trabado: queda en memoria
    ]).then(function (bd) { colaBD = bd || false; return colaBD; });
  }
  function colaOp(modo, fn) {
    return abrirCola().then(function (bd) {
      if (!bd) return null;
      return Promise.race([new Promise(function (ok) {
        try {
          var tx = bd.transaction('cola', modo), rq = fn(tx.objectStore('cola'));
          tx.oncomplete = function () { ok(rq.result === undefined ? true : rq.result); };
          tx.onerror = tx.onabort = function () { ok(null); };
        } catch (e) { ok(null); }
      }), esperar(2500, null)]);
    });
  }
  /* Si el teléfono no deja guardar, la respuesta queda en memoria (hay que
     dejar la página abierta hasta que se envíe) */
  function colaGuardar(item) {
    return colaOp('readwrite', function (st) { return st.put(item); }).then(function (r) {
      if (r === null) colaMem[item.rid] = item; else delete colaMem[item.rid];
    });
  }
  function colaBorrar(rid) {
    delete colaMem[rid];
    return colaOp('readwrite', function (st) { return st.delete(rid); });
  }
  function colaTodas() {
    if (!ENC.DRIVE_URL) return Promise.resolve([]);
    return colaOp('readonly', function (st) { return st.getAll(); }).then(function (lista) {
      var por = {};
      (lista || []).forEach(function (x) { por[x.rid] = x; });
      Object.keys(colaMem).forEach(function (k) { por[k] = colaMem[k]; });
      return Object.keys(por).map(function (k) { return por[k]; })
        .sort(function (a, b) { return a.fecha - b.fecha; });
    });
  }
  function contarCola() {
    if (!ENC.DRIVE_URL) return;
    colaTodas().then(function (l) {
      colaTotal = l.length;
      colaN = l.filter(function (x) { return x.enc === id; }).length;
      pintarRed();
    });
  }

  /* Sube una foto. Sin red (o si tarda más de 3 min) lanza error; si Drive
     contesta, devuelve lo que contestó. */
  function subirFoto(item, qid) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = ctrl ? setTimeout(function () { ctrl.abort(); }, 180000) : null;
    return fetch(ENC.DRIVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // sin consulta previa (CORS)
      body: JSON.stringify({ encuesta: item.enc, pregunta: qid, respuesta: item.rid, fecha: item.fecha,
        etiqueta: item.etiqueta || '', foto: item.fotos[qid].hq }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(t);
      if (!r.ok) return { ok: false, error: 'http ' + r.status };
      return r.json().catch(function () { return { ok: false, error: 'respuesta' }; });
    }, function (e) { clearTimeout(t); throw e; });
  }

  /* Sube las fotos que falten de una respuesta y la guarda en Firestore.
     Devuelve { escritura } (envuelta: si se devolviera la promesa sola, el
     await esperaría a que Firestore confirme, y sin conexión no termina). */
  async function procesar(item, avance) {
    var qids = Object.keys(item.fotos || {});
    for (var i = 0; i < qids.length; i++) {
      var f = item.fotos[qids[i]];
      if (f.drive || f.error) continue;
      if (avance) avance(i + 1, qids.length, item.rid);
      var r = await subirFoto(item, qids[i]);
      if (r && r.ok && ENC.esIdDrive(r.id)) {
        f.drive = r.id;
        f.carpeta = ENC.esIdDrive(r.carpeta) ? r.carpeta : '';
      } else if ((r && r.permanente) || (f.fallas = (f.fallas || 0) + 1) >= 4) {
        f.error = String((r && r.error) || 'drive');
        console.warn('Foto no guardada en Drive (' + f.error + '): queda la copia chica');
      } else {
        await colaGuardar(item);
        throw new Error('Drive: ' + ((r && r.error) || 'sin respuesta'));
      }
      delete f.hq;
      await colaGuardar(item);
    }
    var resp = Object.assign({}, item.respuestas);
    qids.forEach(function (q) {
      var f = item.fotos[q];
      resp[q] = f.drive ? { drive: f.drive, mini: f.mini, carpeta: f.carpeta || '' } : f.mini;
    });
    var ref = db.collection(ENC.COL).doc(item.enc).collection(ENC.SUB_RESP).doc(item.rid);
    var escritura = guardarRespuesta(ref, resp, item.enc);
    await colaBorrar(item.rid);
    return { escritura: escritura };
  }

  function avisar(rid, v) { var f = oyentes[rid]; delete oyentes[rid]; if (f) f(v); }

  /* Recorre la cola, de la más antigua a la más nueva. Se corta al primer
     error (sin red o Drive no responde) y se reintenta más tarde. */
  async function procesarCola(avance) {
    if (subiendo || previa || !db || !ENC.DRIVE_URL) return;
    subiendo = true;
    var vistas = {}, falla = false;
    try {
      while (navigator.onLine) {
        var item = (await colaTodas()).filter(function (x) { return !vistas[x.rid]; })[0];
        if (!item) break;
        vistas[item.rid] = true;
        try {
          avisar(item.rid, await procesar(item, avance));
        } catch (e) {
          console.warn('Fotos a Drive, se reintenta más tarde:', (e && e.message) || e);
          falla = true;
          break;
        }
      }
    } finally {
      subiendo = false;
      if (falla || !navigator.onLine) {
        proximoIntento = Date.now() + pausaCola;
        pausaCola = Math.min(pausaCola * 2, 600000);
      } else {
        pausaCola = 30000;
      }
      /* Las que esperaban respuesta: si no alcanzaron a intentarse y no hubo
         error, otra vuelta; si no, siguen en la cola */
      var otraVuelta = false;
      Object.keys(oyentes).forEach(function (rid) {
        if (!vistas[rid] && !falla && navigator.onLine) otraVuelta = true;
        else avisar(rid, 'cola');
      });
      contarCola();
      if (otraVuelta) setTimeout(function () { procesarCola(avance); }, 0);
    }
  }

  /* Respuesta con fotos: devuelve 'ok' si quedó registrada o 'cola' si
     sigue esperando en el teléfono */
  async function enviarConFotos(item, espera) {
    await colaGuardar(item);
    contarCola();
    var btn = document.getElementById('resp-enviar');
    var listo = new Promise(function (ok) { oyentes[item.rid] = ok; });
    procesarCola(function (i, n, rid) {
      if (rid === item.rid) btn.innerHTML = '<span>' + (n > 1 ? 'Subiendo fotos… ' + i + ' de ' + n : 'Subiendo la foto…') + '</span>';
    });
    var r = await Promise.race([listo, esperar(navigator.onLine ? 240000 : 700, 'cola')]);
    if (!r || r === 'cola') { enCola[item.rid] = true; return 'cola'; }
    btn.innerHTML = '<span>Enviando…</span>';
    var res = await Promise.race([r.escritura.then(function () { return 'ok'; }), esperar(espera, 'cola')]);
    if (res === 'cola') enCola[item.rid] = true;
    return res;
  }

  /* Sigue intentando mientras la página está abierta */
  setInterval(function () {
    if (colaTotal && navigator.onLine && Date.now() >= proximoIntento) procesarCola();
  }, 15000);

  function gracias(modo) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    /* "Llenar otra" no recarga la página: así funciona igual sin conexión */
    var otra = '<button class="rg-btn rg-btn-pri resp-otra" onclick="window.__nuevaRespuesta()">' + ico('plus', 16, 2.4) + '<span>Llenar otra respuesta</span></button>';
    if (modo === 'previa') {
      estado('check', 'Vista previa completada', 'En el enlace real, aquí se habría guardado la respuesta.', otra, 'listo');
    } else if (modo === 'cola') {
      estado('clock', 'Respuesta guardada',
        persistente && colaBD !== false
          ?'Se enviará automáticamente cuando haya conexión. Puedes llenar otra respuesta.'
          : 'Se enviará automáticamente cuando haya conexión. Deja esta página abierta hasta entonces.',
        otra, 'cola');
    } else {
      estado('check', '¡Gracias por responder!', 'Tu respuesta quedó registrada.', otra, 'listo');
    }
  }

  window.__nuevaRespuesta = function () {
    fotos = {};
    enviando = false;
    tocado = false;
    pintar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  /* ── Estado de la conexión y de lo que falta enviar ───────────────────── */
  /* Aviso de "sin conexión" arriba y, en la esquina, cuántas respuestas
     guardadas en este teléfono faltan por enviar */
  function pintarRed() {
    var sin = !navigator.onLine;
    var aviso = document.getElementById('rg-aviso');
    if (aviso) {
      document.getElementById('rg-aviso-ico').innerHTML = ico('alert', 16, 2.2);
      aviso.hidden = !sin || previa;
    }
    var n = pendientes().length + colaN;               // en Firestore + esperando sus fotos
    var cola = document.getElementById('rg-cola');
    if (!cola) return;
    cola.hidden = !n;
    if (!n) return;
    cola.classList.toggle('enviando', !sin);
    document.getElementById('rg-cola-ico').innerHTML = ico('upload', 20, 2.2);
    document.getElementById('rg-cola-n').textContent = n;
    var t = n + (n === 1 ? ' respuesta guardada' : ' respuestas guardadas') +
      (sin ? ' en este teléfono. Se enviarán automáticamente cuando haya conexión.' : '. Enviando…');
    cola.title = t;
    cola.setAttribute('aria-label', t);
  }
  document.getElementById('rg-cola').addEventListener('click', function () {
    var n = pendientes().length + colaN;
    toast(n + (n === 1 ? ' respuesta guardada' : ' respuestas guardadas') +
      (navigator.onLine ? ': se están enviando.' : ': se enviarán automáticamente cuando haya conexión.'));
  });
  window.addEventListener('online', function () {
    pintarRed();
    toast(pendientes().length + colaN ? 'Volvió la conexión: enviando las respuestas guardadas…' : 'Volvió la conexión');
    vigilarPendientes();
    proximoIntento = 0; pausaCola = 30000;
    procesarCola();
  });
  window.addEventListener('offline', function () { pintarRed(); });

  /* Respuestas guardadas sin conexión en visitas anteriores: Firestore las
     reenvía al abrir la página; cuando terminan se limpia el contador. */
  function vigilarPendientes() {
    if (!db || !pendientes().length || !db.waitForPendingWrites) return;
    db.waitForPendingWrites().then(function () {
      var n = pendientes().length;
      guardarPend([]);
      if (n) toast(n === 1 ? 'Se envió la respuesta pendiente' : 'Se enviaron ' + n + ' respuestas pendientes');
    }).catch(function () { /* se reintenta en la próxima visita */ });
  }

  /* ── Página disponible sin conexión ───────────────────────────────────── */
  if ('serviceWorker' in navigator && !previa && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw-encuestas.js', { scope: './' }).catch(function (e) {
      console.warn('sw-encuestas:', e);
    });
  }

  /* ── Arranque ─────────────────────────────────────────────────────────────
     Pensado para que el celular nunca quede en blanco:
     · Se muestra al instante la copia de la encuesta guardada en el teléfono
       (de la última visita) y luego se revisa si hay una versión nueva.
     · Si el almacenamiento del teléfono (IndexedDB) se traba, cosa que pasa
       en algunos iPhone y Android al recargar, se usa una conexión sin él.
     · Todo tiene tiempo límite; si falla, hay botón para reintentar. */
  var CONFIG = {
    apiKey: "AIzaSyB4-Agk4jG2HFMnvLQyB1q4vapZQ01Bh4o",
    authDomain: "redes-con-rostro.firebaseapp.com",
    projectId: "redes-con-rostro",
    storageBucket: "redes-con-rostro.firebasestorage.app",
    messagingSenderId: "138746747295",
    appId: "1:138746747295:web:1ceb9c60d4a4073e6885aa"
  };
  var CACHE_ENC = 'rcr-enc-doc-', CACHE_COD = 'rcr-enc-cod-';
  var mostrada = false, tocado = false;

  function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* lleno o bloqueado */ } }
  function esperar(ms, valor) { return new Promise(function (ok) { setTimeout(function () { ok(valor); }, ms); }); }
  function conLimite(p, ms) {
    return Promise.race([p, esperar(ms).then(function () { throw new Error('tiempo'); })]);
  }

  /* Muestra la encuesta (o el mensaje de cerrada / sin preguntas) */
  function mostrar(datos) {
    enc = datos;
    document.title = (enc.titulo || 'Encuesta') + ' — Redes Con Rostro';
    /* Abierta desde encuestas.redesconrostro.org (dentro de un marco):
       le pasa el título para la pestaña del navegador */
    if (window.parent !== window) {
      try { window.parent.postMessage({ tipo: 'rcr-titulo', titulo: document.title }, '*'); } catch (e) { /* sin marco */ }
    }
    mostrada = true;
    if (enc.estado === 'cerrada' && !previa) { estado('clock', enc.titulo || 'Encuesta', 'Esta encuesta ya no recibe respuestas.'); return; }
    if (!ENC.soloPreguntas(enc.preguntas).length) { estado('inbox', enc.titulo || 'Encuesta', 'Esta encuesta todavía no tiene preguntas.'); return; }
    pintar();
  }

  function errorAbrir() {
    if (mostrada) return;
    estado('alert', 'No se pudo abrir la encuesta',
      navigator.onLine ? 'Revisa tu conexión e inténtalo de nuevo.'
        : 'Sin conexión: para usarla sin internet, primero ábrela una vez con conexión.',
      '<button class="rg-btn rg-btn-pri resp-otra" onclick="location.reload()">' + ico('refresh', 16, 2.4) + '<span>Reintentar</span></button>');
  }

  /* Firestore con el almacenamiento del teléfono; si no responde en 3 s,
     una segunda conexión sin él (sigue funcionando, sin cola persistente) */
  async function abrirBase() {
    firebase.initializeApp(CONFIG);
    var base = firebase.firestore();
    var r = await Promise.race([
      base.enablePersistence({ synchronizeTabs: true }).then(function () { return 'ok'; }, function () { return 'no'; }),
      esperar(3000, 'lento')
    ]);
    if (r === 'ok') { persistente = true; return base; }
    if (r === 'no') return base;                       // sigue en memoria
    console.warn('Almacenamiento del teléfono trabado: se usa conexión sin él');
    return firebase.initializeApp(CONFIG, 'sin-cache').firestore();
  }

  (async function () {
    var codigo = String(params.get('c') || '').trim().toLowerCase();
    if (!id && !ENC.esCodigo(codigo)) { estado('alert', 'Enlace incompleto', 'Pide que te reenvíen el enlace de la encuesta.'); return; }
    if (!id) id = leerLocal(CACHE_COD + codigo) || null;

    /* 1) Copia guardada: se ve al instante (también sin conexión) */
    var copia = id && leerLocal(CACHE_ENC + id);
    if (copia && copia.preguntas) mostrar(copia);

    /* Si tarda, un aviso discreto (sin tarjeta) para no dejar la pantalla en blanco */
    setTimeout(function () {
      if (!mostrada && !app.innerHTML) {
        app.className = 'con-estado';
        app.innerHTML = '<p class="resp-cargando">Cargando la encuesta…</p>';
      }
    }, 2500);

    /* Formulario empezado: no se reemplaza con la versión nueva */
    document.addEventListener('input', function () { tocado = true; }, true);
    document.addEventListener('change', function () { tocado = true; }, true);

    try {
      db = await abrirBase();
      if (!persistente) guardarPend([]);   // sin almacenamiento, lo de antes no se puede contar
      contarCola();                        // respuestas que esperan subir sus fotos

      /* 2) Versión actual desde Firestore (con tiempo límite) */
      if (!id) {
        var cs = await conLimite(db.collection(ENC.COL_COD).doc(codigo).get(), 9000);
        if (!cs.exists || !cs.data().encuestaId) {
          estado('alert', 'Esta encuesta ya no está disponible', 'Revisa que el enlace esté completo o pide que te lo reenvíen.');
          return;
        }
        id = cs.data().encuestaId;
        guardarLocal(CACHE_COD + codigo, id);
      }
      var snap = await conLimite(db.collection(ENC.COL).doc(id).get(), 9000);
      if (!snap.exists) {
        try { localStorage.removeItem(CACHE_ENC + id); } catch (e) {}
        if (!tocado) estado('alert', 'Esta encuesta ya no está disponible', 'Puede que la hayan eliminado.');
        return;
      }
      var nueva = snap.data();
      guardarLocal(CACHE_ENC + id, nueva);
      pintarRed();
      vigilarPendientes();
      procesarCola();
      /* 3) Si ya se mostraba la copia y cambió, se actualiza solo si la
         persona todavía no empezó a responder */
      if (!mostrada) mostrar(nueva);
      else if (!tocado && JSON.stringify(nueva) !== JSON.stringify(enc)) mostrar(nueva);
    } catch (e) {
      console.error('responder-encuesta:', e);
      errorAbrir();
    }
  })();
})();
</script>
</body>
</html>
