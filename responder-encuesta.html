<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e8f4fd">
<title>Encuesta — Redes Con Rostro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="resp-body">

<!-- Página pública para responder una encuesta: sin login ni navegación.
     Lee Encuestas/{id} y guarda la respuesta en RespuestasEncuesta. -->
<div class="resp-wrap">
  <div id="resp-app">
    <div class="resp-estado">
      <span class="spinner dark"></span>
      <h2>Abriendo la encuesta…</h2>
    </div>
  </div>
  <div class="resp-foot">Redes Con Rostro</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebase (solo Firestore; responder no requiere iniciar sesión) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* RCR mínimo: encuestas.js solo necesita esc() de él */
window.RCR = { modulos: {} };
RCR.esc = function (v) {
  var d = document.createElement('div');
  d.textContent = (v == null) ? '' : String(v);
  return d.innerHTML;
};
</script>
<script src="icons.js"></script>
<script src="encuestas.js"></script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var previa = params.get('previa') === '1';
  var app = document.getElementById('resp-app');
  var enc = null, db = null, enviando = false;
  var fotos = {};   // { idPregunta: base64 JPEG } de las preguntas "Subir imagen"

  function pintarFoto(qid) {
    var box = document.getElementById('rf-' + qid);
    if (!box) return;
    var url = fotos[qid];
    var lbl = box.querySelector('.resp-subir');
    var prev = box.querySelector('.resp-foto-prev');
    if (prev) prev.remove();
    lbl.classList.toggle('hidden', !!url);
    if (url) {
      box.insertAdjacentHTML('afterbegin',
        '<div class="resp-foto-prev"><img src="' + url + '" alt="Foto elegida">' +
          '<button type="button" class="resp-foto-quitar" data-q="' + qid + '" onclick="window.__quitarFoto(this.dataset.q)">' + ico('x', 14, 2.6) + 'Quitar</button>' +
        '</div>');
    }
  }

  window.__elegirFoto = function (qid, input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    toast('Preparando la foto…');
    ENC.comprimirImagen(file, ENC.IMG_RESP).then(function (url) {
      fotos[qid] = url;
      pintarFoto(qid);
      var fs = document.getElementById('rq-' + qid);
      if (fs) { fs.classList.remove('con-error'); fs.querySelector('.resp-err').textContent = ''; }
      actualizar();
    }).catch(function () { toast('Elige un archivo de imagen (JPG o PNG)'); });
  };

  window.__quitarFoto = function (qid) {
    delete fotos[qid];
    pintarFoto(qid);
    actualizar();
  };

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  function estado(icono, titulo, texto, extra) {
    app.innerHTML =
      '<div class="resp-estado">' +
        '<div class="resp-estado-ico">' + ico(icono, 26) + '</div>' +
        '<h2>' + RCR.esc(titulo) + '</h2>' +
        (texto ? '<p>' + RCR.esc(texto) + '</p>' : '') +
        (extra || '') +
      '</div>';
  }

  /* ── Pintar el formulario ─────────────────────────────────────────────── */
  function preguntaHtml(q, n) {
    var name = 'q_' + q.id, campo = '';
    var a = ENC.attr;

    if (ENC.esSeccion(q)) {
      return '<div class="resp-sec" id="rq-' + q.id + '">' +
        '<h2>' + RCR.esc(q.texto) + '</h2>' +
        (q.descripcion ? '<p>' + RCR.esc(q.descripcion) + '</p>' : '') +
        ENC.apoyoPublico(q) +
      '</div>';
    }

    if (q.tipo === 'numero') {
      campo = '<input class="form-inp resp-numero" name="' + name + '" inputmode="decimal" autocomplete="off" maxlength="30" placeholder="Escribe un número">';
    } else if (q.tipo === 'imagen') {
      campo = '<div class="resp-foto" id="rf-' + q.id + '">' +
        '<label class="resp-subir">' +
          '<input type="file" accept="image/*" class="sr-only" data-q="' + q.id + '" onchange="window.__elegirFoto(this.dataset.q, this)">' +
          ico('image', 22) + '<span><strong>Subir una foto</strong><small>JPG o PNG · también puedes tomarla con el celular</small></span>' +
        '</label>' +
      '</div>';
    } else if (q.tipo === 'cuadricula') {
      var cols = q.columnas || [];
      campo = '<div class="resp-grid" style="--cols:' + cols.length + '">' +
        '<div class="resp-grid-cab" aria-hidden="true"><span></span>' +
          cols.map(function (c) { return '<span>' + RCR.esc(c) + '</span>'; }).join('') + '</div>' +
        (q.filas || []).map(function (f) {
          return '<div class="resp-grid-fila" role="radiogroup" aria-label="' + a(f.t) + '">' +
            '<div class="resp-grid-lbl">' + RCR.esc(f.t) + '</div>' +
            cols.map(function (c) {
              return '<label class="resp-grid-celda"><input type="radio" name="' + name + '_' + a(f.id) + '" value="' + a(c) + '" aria-label="' + a(f.t + ': ' + c) + '">' +
                '<span class="resp-marca"></span><span class="resp-grid-col">' + RCR.esc(c) + '</span></label>';
            }).join('') +
          '</div>';
        }).join('') +
      '</div>';
    } else if (q.tipo === 'corto') {
      campo = '<input class="form-inp" name="' + name + '" maxlength="500" placeholder="Tu respuesta">';
    } else if (q.tipo === 'largo') {
      campo = '<textarea class="form-inp" name="' + name + '" rows="4" maxlength="5000" placeholder="Tu respuesta"></textarea>';
    } else if (q.tipo === 'unica' || q.tipo === 'multiple') {
      var tipoInput = q.tipo === 'multiple' ? 'checkbox' : 'radio';
      campo = '<div class="resp-opciones">' + (q.opciones || []).map(function (o) {
        return '<label class="resp-opcion"><input type="' + tipoInput + '" name="' + name + '" value="' + a(o) + '">' +
                 '<span class="resp-marca ' + (q.tipo === 'multiple' ? 'cuadro' : '') + '"></span>' +
                 '<span class="resp-opcion-txt">' + RCR.esc(o) + '</span></label>';
      }).join('') + '</div>' +
      (q.tipo === 'multiple'
        ? '<div class="resp-ayuda" id="ra-' + q.id + '">' +
            (ENC.maxValido(q) ? 'Puedes elegir hasta ' + ENC.maxValido(q) + (ENC.maxValido(q) === 1 ? ' opción.' : ' opciones.') : 'Puedes elegir varias.') +
          '</div>'
        : '');
    } else if (q.tipo === 'escala') {
      campo = '<div class="resp-escala">' + [1, 2, 3, 4, 5].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>' +
      '<div class="resp-escala-ext"><span>Bajo</span><span>Alto</span></div>';
    } else if (q.tipo === 'sino') {
      campo = '<div class="resp-sino">' + ['Sí', 'No'].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>';
    }

    return '' +
      '<fieldset class="card resp-q" id="rq-' + q.id + '" data-id="' + q.id + '">' +
        '<legend class="resp-q-txt"><span class="resp-q-n">' + n + '.</span> ' + RCR.esc(q.texto) +
          (q.requerida ? ' <span class="resp-req" aria-label="obligatoria">*</span>' : '') + '</legend>' +
        ENC.apoyoPublico(q) +
        campo +
        '<div class="resp-err" role="alert"></div>' +
      '</fieldset>';
  }

  function pintar() {
    var ps = enc.preguntas || [];
    var hayReq = ps.some(function (q) { return q.requerida; });
    app.innerHTML =
      (previa ? '<div class="resp-previa">' + ico('eye', 16) + '<span>Vista previa: las respuestas no se guardan.</span></div>' : '') +
      '<header class="card resp-head">' +
        '<div class="resp-marca-app">mi redes con rostro</div>' +
        '<h1>' + RCR.esc(enc.titulo || 'Encuesta') + '</h1>' +
        (enc.descripcion ? '<p class="resp-desc">' + RCR.esc(enc.descripcion) + '</p>' : '') +
        (hayReq ? '<p class="resp-nota"><span class="resp-req">*</span> Obligatoria</p>' : '') +
      '</header>' +
      '<form id="resp-form" novalidate>' +
        ps.map(function (q) { return preguntaHtml(q, 0); }).join('') +
        '<button type="submit" class="btn btn-primary resp-enviar" id="resp-enviar">Enviar respuestas</button>' +
      '</form>';

    var form = document.getElementById('resp-form');
    form.addEventListener('change', actualizar);
    form.addEventListener('input', function (e) {
      var fs = e.target.closest('.resp-q');
      if (fs) { fs.classList.remove('con-error'); fs.querySelector('.resp-err').textContent = ''; }
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); enviar(); });
    actualizar();
  }

  /* ── Leer respuestas y aplicar la lógica condicional ──────────────────── */
  function leer() {
    var form = document.getElementById('resp-form'), r = {};
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      var name = 'q_' + q.id;
      if (q.tipo === 'corto' || q.tipo === 'largo' || q.tipo === 'numero') {
        var el = form.elements[name];
        r[q.id] = el ? el.value.trim() : '';
      } else if (q.tipo === 'imagen') {
        r[q.id] = fotos[q.id] || '';
      } else if (q.tipo === 'cuadricula') {
        var g = {};
        (q.filas || []).forEach(function (f) {
          var m = form.querySelector('input[name="' + name + '_' + f.id + '"]:checked');
          if (m) g[f.id] = m.value;
        });
        r[q.id] = g;
      } else if (q.tipo === 'multiple') {
        r[q.id] = Array.prototype.slice.call(form.querySelectorAll('input[name="' + name + '"]:checked'))
          .map(function (x) { return x.value; });
      } else {
        var sel = form.querySelector('input[name="' + name + '"]:checked');
        r[q.id] = sel ? (q.tipo === 'escala' ? Number(sel.value) : sel.value) : '';
      }
    });
    return r;
  }

  function vacio(v) {
    return v == null || v === '' || (Array.isArray(v) && !v.length) ||
      (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
  }

  function actualizar() {
    var r = leer();
    var vis = ENC.visibles(enc.preguntas, r);
    var n = 0;
    (enc.preguntas || []).forEach(function (q) {
      var fs = document.getElementById('rq-' + q.id);
      if (!fs) return;
      var ver = !!vis[q.id];
      fs.classList.toggle('hidden', !ver);
      if (ENC.esSeccion(q)) return;
      fs.disabled = !ver;
      if (ver) fs.querySelector('.resp-q-n').textContent = (++n) + '.';
      /* Opción múltiple con tope: al llegar al máximo se bloquean las demás */
      var max = ENC.maxValido(q);
      if (max) {
        var lleno = (r[q.id] || []).length >= max;
        fs.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.disabled = lleno && !cb.checked;
          cb.closest('.resp-opcion').classList.toggle('bloqueada', cb.disabled);
        });
        var ay = document.getElementById('ra-' + q.id);
        if (ay) ay.textContent = lleno
          ? 'Ya elegiste ' + max + (max === 1 ? ' opción' : ' opciones') + '. Quita una para cambiarla.'
          : 'Puedes elegir hasta ' + max + (max === 1 ? ' opción.' : ' opciones.');
      }
    });
    return { r: r, vis: vis };
  }

  /* ── Enviar ───────────────────────────────────────────────────────────── */
  async function enviar() {
    if (enviando) return;
    var st = actualizar();
    var primero = null;

    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      var fs = document.getElementById('rq-' + q.id);
      var falta = st.vis[q.id] && q.requerida && vacio(st.r[q.id]);
      var malNum = st.vis[q.id] && q.tipo === 'numero' && !vacio(st.r[q.id]) && isNaN(ENC.leerNumero(st.r[q.id]));
      var max = ENC.maxValido(q);
      var demas = st.vis[q.id] && max && (st.r[q.id] || []).length > max;
      /* Cuadrícula obligatoria: hay que responder todas las filas */
      var faltaFila = st.vis[q.id] && q.requerida && q.tipo === 'cuadricula' && !falta &&
        Object.keys(st.r[q.id] || {}).length < (q.filas || []).length;
      var mal = !!(falta || malNum || demas || faltaFila);
      fs.classList.toggle('con-error', mal);
      fs.querySelector('.resp-err').textContent = falta ? 'Esta pregunta es obligatoria'
        : (faltaFila ? 'Responde todas las filas'
        : (malNum ? 'Escribe solo un número (por ejemplo 12 o 3,5)'
        : (demas ? 'Elige como máximo ' + max : '')));
      if (mal && !primero) primero = fs;
    });
    if (primero) {
      primero.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var msg = primero.querySelector('.resp-err').textContent;
      toast(msg.indexOf('número') >= 0 ? 'Revisa los números'
        : ((msg.indexOf('máximo') >= 0 || msg.indexOf('filas') >= 0) ? msg : 'Faltan preguntas obligatorias'));
      return;
    }

    /* Solo se guardan las preguntas visibles y respondidas */
    var respuestas = {};
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      if (st.vis[q.id] && !vacio(st.r[q.id])) {
        respuestas[q.id] = q.tipo === 'numero' ? ENC.leerNumero(st.r[q.id]) : st.r[q.id];
      }
    });
    if (JSON.stringify(respuestas).length > ENC.LIMITE_DOC) {
      toast('Las fotos pesan demasiado. Quita alguna e inténtalo de nuevo.');
      return;
    }

    if (previa) { gracias(true); return; }

    enviando = true;
    var btn = document.getElementById('resp-enviar');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      await db.collection(ENC.COL_RESP).add({
        encuestaId: id,
        respuestas: respuestas,
        enviado: firebase.firestore.FieldValue.serverTimestamp()
      });
      gracias(false);
    } catch (e) {
      console.error('responder-encuesta:', e);
      toast('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.');
      btn.disabled = false; btn.textContent = 'Enviar respuestas';
    }
    enviando = false;
  }

  function gracias(esPrevia) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    estado('check', esPrevia ? 'Vista previa completada' : '¡Gracias por responder!',
      esPrevia ? 'En el enlace real, aquí se habría guardado la respuesta.' : 'Tu respuesta quedó registrada.',
      '<button class="btn btn-glass resp-otra" onclick="location.reload()">Enviar otra respuesta</button>');
  }

  /* ── Arranque ─────────────────────────────────────────────────────────── */
  (async function () {
    if (!id) { estado('alert', 'Enlace incompleto', 'Pide que te reenvíen el enlace de la encuesta.'); return; }
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyB4-Agk4jG2HFMnvLQyB1q4vapZQ01Bh4o",
        authDomain: "redes-con-rostro.firebaseapp.com",
        projectId: "redes-con-rostro",
        storageBucket: "redes-con-rostro.firebasestorage.app",
        messagingSenderId: "138746747295",
        appId: "1:138746747295:web:1ceb9c60d4a4073e6885aa"
      });
      db = firebase.firestore();
      var snap = await db.collection(ENC.COL).doc(id).get();
      if (!snap.exists) { estado('alert', 'Esta encuesta ya no está disponible', 'Puede que la hayan eliminado.'); return; }
      enc = snap.data();
      document.title = (enc.titulo || 'Encuesta') + ' — Redes Con Rostro';
      if (enc.estado === 'cerrada' && !previa) {
        estado('clock', enc.titulo || 'Encuesta', 'Esta encuesta ya no recibe respuestas.');
        return;
      }
      if (!ENC.soloPreguntas(enc.preguntas).length) { estado('inbox', enc.titulo || 'Encuesta', 'Esta encuesta todavía no tiene preguntas.'); return; }
      pintar();
    } catch (e) {
      console.error('responder-encuesta:', e);
      estado('alert', 'No se pudo abrir la encuesta', 'Revisa tu conexión o pide que te reenvíen el enlace.');
    }
  })();
})();
</script>
</body>
</html>
