<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1fb">
<title>Encuesta — Redes Con Rostro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="resp-body">

<!-- Página pública para responder una encuesta: sin login ni navegación.
     Se abre con ?id=<encuesta> o con ?c=<código corto> (desde /e/?código).
     Lee Encuestas/{id} y guarda la respuesta en Encuestas/{id}/Respuestas.
     · Cada sección es un paso (tarjeta) con Atrás / Continuar.
     · Funciona sin conexión después de abrirla una vez con internet:
       la página queda guardada (sw-encuestas.js) y las respuestas esperan en
       el teléfono hasta que vuelve la conexión (persistencia de Firestore). -->
<div class="rg-fondo" aria-hidden="true"></div>
<div class="resp-wrap">
  <!-- Aviso cuando no hay internet -->
  <div class="rg-aviso" id="rg-aviso" role="status" hidden>
    <span class="rg-aviso-ico" id="rg-aviso-ico"></span>
    <span><strong>Sin conexión.</strong> Puedes seguir respondiendo: las respuestas se enviarán automáticamente cuando haya conexión.</span>
  </div>
  <div id="resp-app">
    <div class="resp-estado">
      <span class="spinner dark"></span>
      <h2>Abriendo la encuesta…</h2>
    </div>
  </div>
  <div class="resp-foot">Redes Con Rostro</div>
</div>

<!-- Ícono flotante: respuestas guardadas en este teléfono que faltan enviar -->
<button type="button" class="rg-cola" id="rg-cola" hidden aria-live="polite">
  <span class="rg-cola-ico" id="rg-cola-ico"></span>
  <span class="rg-cola-n" id="rg-cola-n">0</span>
</button>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebase (solo Firestore; responder no requiere iniciar sesión) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* RCR mínimo: encuestas.js solo necesita esc() de él */
window.RCR = { modulos: {} };
RCR.esc = function (v) {
  var d = document.createElement('div');
  d.textContent = (v == null) ? '' : String(v);
  return d.innerHTML;
};
</script>
<script src="icons.js"></script>
<script src="encuestas.js"></script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var previa = params.get('previa') === '1';
  var app = document.getElementById('resp-app');
  var enc = null, db = null, enviando = false, persistente = false;
  var fotos = {};          // { idPregunta: base64 JPEG } de las preguntas "Subir imagen"
  var pags = [];           // [{ sec: Sección|null, items: [Pregunta] }]
  var pagAct = 0;

  /* ── Avisos breves ────────────────────────────────────────────────────── */
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  function estado(icono, titulo, texto, extra, clase) {
    app.innerHTML =
      '<div class="resp-estado ' + (clase || '') + '">' +
        '<div class="resp-estado-ico">' + ico(icono, 28, 2.2) + '</div>' +
        '<h2>' + RCR.esc(titulo) + '</h2>' +
        (texto ? '<p>' + RCR.esc(texto) + '</p>' : '') +
        (extra || '') +
      '</div>';
    pintarRed();
  }

  /* ── Fotos (preguntas "Subir imagen") ─────────────────────────────────── */
  function pintarFoto(qid) {
    var box = document.getElementById('rf-' + qid);
    if (!box) return;
    var url = fotos[qid];
    var lbl = box.querySelector('.resp-subir');
    var prev = box.querySelector('.resp-foto-prev');
    if (prev) prev.remove();
    lbl.classList.toggle('hidden', !!url);
    if (url) {
      box.insertAdjacentHTML('afterbegin',
        '<div class="resp-foto-prev"><img src="' + url + '" alt="Foto elegida">' +
          '<button type="button" class="resp-foto-quitar" data-q="' + qid + '" onclick="window.__quitarFoto(this.dataset.q)">' + ico('x', 14, 2.6) + 'Quitar</button>' +
        '</div>');
    }
  }

  window.__elegirFoto = function (qid, input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    toast('Preparando la foto…');
    ENC.comprimirImagen(file, ENC.IMG_RESP).then(function (url) {
      fotos[qid] = url;
      pintarFoto(qid);
      limpiarError(document.getElementById('rq-' + qid));
      actualizar();
    }).catch(function () { toast('Elige un archivo de imagen (JPG o PNG)'); });
  };

  window.__quitarFoto = function (qid) {
    delete fotos[qid];
    pintarFoto(qid);
    actualizar();
  };

  /* ── HTML de cada pregunta ────────────────────────────────────────────── */
  function preguntaHtml(q) {
    var name = 'q_' + q.id, campo = '';
    var a = ENC.attr;

    if (ENC.esSeccion(q)) {
      return '<div class="resp-sec" id="rq-' + q.id + '">' +
        '<h2>' + RCR.esc(q.texto) + '</h2>' +
        (q.descripcion ? '<p>' + RCR.esc(q.descripcion) + '</p>' : '') +
        ENC.apoyoPublico(q) +
      '</div>';
    }

    if (q.tipo === 'numero') {
      campo = '<input class="rg-campo resp-numero" name="' + name + '" inputmode="decimal" autocomplete="off" maxlength="30" placeholder="Escribe un número">';
    } else if (q.tipo === 'imagen') {
      campo = '<div class="resp-foto" id="rf-' + q.id + '">' +
        '<label class="resp-subir">' +
          '<input type="file" accept="image/*" class="sr-only" data-q="' + q.id + '" onchange="window.__elegirFoto(this.dataset.q, this)">' +
          '<span class="resp-subir-ico">' + ico('image', 22) + '</span>' +
          '<span><strong>Subir una foto</strong><small>JPG o PNG · también puedes tomarla con el celular</small></span>' +
        '</label>' +
      '</div>';
    } else if (q.tipo === 'cuadricula') {
      var cols = q.columnas || [];
      campo = '<div class="resp-grid" style="--cols:' + cols.length + '">' +
        '<div class="resp-grid-cab" aria-hidden="true"><span></span>' +
          cols.map(function (c) { return '<span>' + RCR.esc(c) + '</span>'; }).join('') + '</div>' +
        (q.filas || []).map(function (f) {
          return '<div class="resp-grid-fila" role="radiogroup" aria-label="' + a(f.t) + '">' +
            '<div class="resp-grid-lbl">' + RCR.esc(f.t) + '</div>' +
            '<div class="resp-grid-celdas">' +
            cols.map(function (c) {
              return '<label class="resp-grid-celda"><input type="radio" name="' + name + '_' + a(f.id) + '" value="' + a(c) + '" aria-label="' + a(f.t + ': ' + c) + '">' +
                '<span class="resp-marca"></span><span class="resp-grid-col">' + RCR.esc(c) + '</span></label>';
            }).join('') +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    } else if (q.tipo === 'corto') {
      campo = '<input class="rg-campo" name="' + name + '" maxlength="500" placeholder="Tu respuesta" autocomplete="off">';
    } else if (q.tipo === 'largo') {
      campo = '<textarea class="rg-campo" name="' + name + '" rows="4" maxlength="5000" placeholder="Tu respuesta"></textarea>';
    } else if (q.tipo === 'unica' || q.tipo === 'multiple') {
      var tipoInput = q.tipo === 'multiple' ? 'checkbox' : 'radio';
      campo = '<div class="resp-opciones">' + (q.opciones || []).map(function (o) {
        return '<label class="resp-opcion"><input type="' + tipoInput + '" name="' + name + '" value="' + a(o) + '">' +
                 '<span class="resp-marca ' + (q.tipo === 'multiple' ? 'cuadro' : '') + '"></span>' +
                 '<span class="resp-opcion-txt">' + RCR.esc(o) + '</span></label>';
      }).join('') + '</div>' +
      (q.tipo === 'multiple'
        ? '<div class="resp-ayuda" id="ra-' + q.id + '">' +
            (ENC.maxValido(q) ? 'Puedes elegir hasta ' + ENC.maxValido(q) + (ENC.maxValido(q) === 1 ? ' opción.' : ' opciones.') : 'Puedes elegir varias.') +
          '</div>'
        : '');
    } else if (q.tipo === 'escala') {
      campo = '<div class="rg-seg resp-escala">' + [1, 2, 3, 4, 5].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>' +
      '<div class="resp-escala-ext"><span>Bajo</span><span>Alto</span></div>';
    } else if (q.tipo === 'sino') {
      campo = '<div class="rg-seg resp-sino">' + ['Sí', 'No'].map(function (v) {
        return '<label class="resp-num"><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>';
      }).join('') + '</div>';
    }

    return '' +
      '<fieldset class="resp-q" id="rq-' + q.id + '" data-id="' + q.id + '">' +
        '<legend class="resp-q-txt"><span class="resp-q-n"></span><span class="resp-q-t">' + RCR.esc(q.texto) +
          (q.requerida ? ' <span class="resp-req" aria-label="obligatoria">*</span>' : '') + '</span></legend>' +
        ENC.apoyoPublico(q) +
        campo +
        '<div class="resp-err" role="alert"></div>' +
      '</fieldset>';
  }

  /* ── Pasos: cada sección es una tarjeta; lo que va antes de la primera
     sección forma el primer paso, junto con la bienvenida. ─────────────── */
  function armarPaginas(ps) {
    var out = [], act = { sec: null, items: [] };
    ps.forEach(function (q) {
      if (ENC.esSeccion(q)) {
        if (act.sec || act.items.length) out.push(act);
        act = { sec: q, items: [] };
      } else act.items.push(q);
    });
    if (act.sec || act.items.length) out.push(act);
    return out;
  }

  /* Pasos que se ven según las respuestas (una sección con condición que no
     se cumple, o sin ninguna pregunta visible, se salta) */
  function pagVisibles(vis) {
    return pags.map(function (p, k) { return k; }).filter(function (k) {
      var p = pags[k];
      if (k === 0) return true;
      if (p.sec && !vis[p.sec.id]) return false;
      return p.items.some(function (q) { return vis[q.id]; });
    });
  }

  function pintar() {
    var ps = enc.preguntas || [];
    pags = armarPaginas(ps);
    var hayReq = ps.some(function (q) { return q.requerida; });
    var varias = pags.length > 1;

    var hero =
      '<header class="resp-head">' +
        '<div class="resp-marca-app">Redes Con Rostro</div>' +
        '<h1>' + RCR.esc(enc.titulo || 'Encuesta') + '</h1>' +
        (enc.descripcion ? '<p class="resp-desc">' + RCR.esc(enc.descripcion) + '</p>' : '') +
        (hayReq ? '<p class="resp-nota"><b class="resp-req">*</b> Pregunta obligatoria</p>' : '') +
      '</header>';

    app.innerHTML =
      (previa ? '<div class="resp-previa">' + ico('eye', 16) + '<span>Vista previa: las respuestas no se guardan.</span></div>' : '') +
      '<div class="rg-barra" id="rg-barra">' +
        '<span class="rg-barra-tit">' + RCR.esc(enc.titulo || 'Encuesta') + '</span>' +
        (varias ? '<span class="rg-paso" id="rg-paso"></span>' : '') +
        (varias ? '<div class="rg-prog" aria-hidden="true"><i id="rg-prog-fill"></i></div>' : '') +
      '</div>' +
      '<form id="resp-form" novalidate>' +
        pags.map(function (p, k) {
          return '<section class="rg-pag" data-p="' + k + '"' + (k ? ' hidden' : '') + '>' +
            (k === 0 ? hero : '') +
            (p.sec ? preguntaHtml(p.sec) : '') +
            p.items.map(preguntaHtml).join('') +
          '</section>';
        }).join('') +
        '<div class="rg-nav">' +
          '<button type="button" class="rg-btn rg-btn-sec" id="rg-atras" hidden>' + ico('chevronLeft', 18, 2.4) + '<span>Atrás</span></button>' +
          '<button type="submit" class="rg-btn rg-btn-pri" id="resp-enviar"><span>Continuar</span>' + ico('chevronRight', 18, 2.4) + '</button>' +
        '</div>' +
      '</form>';

    var form = document.getElementById('resp-form');
    form.addEventListener('change', function () { pintarProgreso(); });
    form.addEventListener('input', function (e) { limpiarError(e.target.closest('.resp-q')); });
    form.addEventListener('submit', function (e) { e.preventDefault(); continuar(); });
    document.getElementById('rg-atras').addEventListener('click', atras);
    actualizar();
    irA(0, 0);
    pintarRed();
  }

  /* ── Navegación entre pasos ───────────────────────────────────────────── */
  function irA(k, dir) {
    var st = actualizar();
    var vs = pagVisibles(st.vis);
    pagAct = k;
    document.querySelectorAll('.rg-pag').forEach(function (s) {
      var esta = +s.dataset.p === k;
      s.hidden = !esta;
      s.classList.remove('entra-der', 'entra-izq');
      if (esta && dir) { void s.offsetWidth; s.classList.add(dir > 0 ? 'entra-der' : 'entra-izq'); }
    });
    pintarProgreso(vs);
    if (dir) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Paso actual, barra de progreso y botones (cambian si una respuesta
     muestra u oculta una sección) */
  function pintarProgreso(vs) {
    vs = vs || pagVisibles(actualizar().vis);
    var pos = Math.max(0, vs.indexOf(pagAct)), total = vs.length, ultimo = pos === total - 1;
    var paso = document.getElementById('rg-paso');
    if (paso) paso.textContent = 'Paso ' + (pos + 1) + ' de ' + total;
    var fill = document.getElementById('rg-prog-fill');
    if (fill) fill.style.width = Math.round((pos + 1) / total * 100) + '%';
    document.getElementById('rg-atras').hidden = pos <= 0;
    var btn = document.getElementById('resp-enviar');
    if (btn.disabled) return;
    btn.classList.toggle('final', ultimo);
    btn.innerHTML = ultimo
      ? '<span>' + (previa ? 'Terminar vista previa' : 'Enviar respuestas') + '</span>' + ico('check', 18, 2.6)
      : '<span>Continuar</span>' + ico('chevronRight', 18, 2.4);
  }

  function continuar() {
    if (enviando) return;
    var st = actualizar();
    var pag = pags[pagAct];
    var err = validar(pag.items, st);
    if (err) { mostrarError(err); return; }
    var vs = pagVisibles(st.vis);
    var siguientes = vs.filter(function (k) { return k > pagAct; });
    if (siguientes.length) irA(siguientes[0], 1);
    else enviar(st);
  }

  function atras() {
    var vs = pagVisibles(actualizar().vis);
    var antes = vs.filter(function (k) { return k < pagAct; });
    if (antes.length) irA(antes[antes.length - 1], -1);
  }

  /* ── Leer respuestas y aplicar la lógica condicional ──────────────────── */
  function leer() {
    var form = document.getElementById('resp-form'), r = {};
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      var name = 'q_' + q.id;
      if (q.tipo === 'corto' || q.tipo === 'largo' || q.tipo === 'numero') {
        var el = form.elements[name];
        r[q.id] = el ? el.value.trim() : '';
      } else if (q.tipo === 'imagen') {
        r[q.id] = fotos[q.id] || '';
      } else if (q.tipo === 'cuadricula') {
        var g = {};
        (q.filas || []).forEach(function (f) {
          var m = form.querySelector('input[name="' + name + '_' + f.id + '"]:checked');
          if (m) g[f.id] = m.value;
        });
        r[q.id] = g;
      } else if (q.tipo === 'multiple') {
        r[q.id] = Array.prototype.slice.call(form.querySelectorAll('input[name="' + name + '"]:checked'))
          .map(function (x) { return x.value; });
      } else {
        var sel = form.querySelector('input[name="' + name + '"]:checked');
        r[q.id] = sel ? (q.tipo === 'escala' ? Number(sel.value) : sel.value) : '';
      }
    });
    return r;
  }

  function vacio(v) {
    return v == null || v === '' || (Array.isArray(v) && !v.length) ||
      (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
  }

  function actualizar() {
    var r = leer();
    var vis = ENC.visibles(enc.preguntas, r);
    var n = 0;
    (enc.preguntas || []).forEach(function (q) {
      var fs = document.getElementById('rq-' + q.id);
      if (!fs) return;
      var ver = !!vis[q.id];
      fs.classList.toggle('hidden', !ver);
      if (ENC.esSeccion(q)) return;
      fs.disabled = !ver;
      if (ver) fs.querySelector('.resp-q-n').textContent = ++n;
      /* Opción múltiple con tope: al llegar al máximo se bloquean las demás */
      var max = ENC.maxValido(q);
      if (max) {
        var lleno = (r[q.id] || []).length >= max;
        fs.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.disabled = lleno && !cb.checked;
          cb.closest('.resp-opcion').classList.toggle('bloqueada', cb.disabled);
        });
        var ay = document.getElementById('ra-' + q.id);
        if (ay) ay.textContent = lleno
          ? 'Ya elegiste ' + max + (max === 1 ? ' opción' : ' opciones') + '. Quita una para cambiarla.'
          : 'Puedes elegir hasta ' + max + (max === 1 ? ' opción.' : ' opciones.');
      }
    });
    return { r: r, vis: vis };
  }

  /* ── Validación (de un paso o de todo) ────────────────────────────────── */
  function limpiarError(fs) {
    if (!fs || !fs.classList.contains('con-error')) return;
    fs.classList.remove('con-error');
    fs.querySelector('.resp-err').textContent = '';
  }

  function validar(qs, st) {
    var primero = null;
    qs.forEach(function (q) {
      if (ENC.esSeccion(q)) return;
      var fs = document.getElementById('rq-' + q.id);
      if (!fs) return;
      var v = st.vis[q.id], r = st.r[q.id];
      var falta = v && q.requerida && vacio(r);
      var malNum = v && q.tipo === 'numero' && !vacio(r) && isNaN(ENC.leerNumero(r));
      var max = ENC.maxValido(q);
      var demas = v && max && (r || []).length > max;
      var faltaFila = v && q.requerida && q.tipo === 'cuadricula' && !falta &&
        Object.keys(r || {}).length < (q.filas || []).length;
      var msg = falta ? 'Esta pregunta es obligatoria'
        : (faltaFila ? 'Responde todas las filas'
        : (malNum ? 'Escribe solo un número (por ejemplo 12 o 3,5)'
        : (demas ? 'Elige como máximo ' + max : '')));
      fs.classList.toggle('con-error', !!msg);
      fs.querySelector('.resp-err').innerHTML = msg ? ico('alert', 14) + '<span>' + RCR.esc(msg) + '</span>' : '';
      if (msg && !primero) primero = fs;
    });
    return primero;
  }

  function mostrarError(fs) {
    fs.scrollIntoView({ behavior: 'smooth', block: 'center' });
    fs.classList.remove('sacude'); void fs.offsetWidth; fs.classList.add('sacude');
    var msg = fs.querySelector('.resp-err').textContent;
    toast(msg.indexOf('número') >= 0 ? 'Revisa los números'
      : ((msg.indexOf('máximo') >= 0 || msg.indexOf('filas') >= 0) ? msg : 'Faltan preguntas obligatorias'));
  }

  /* ── Enviar (también sin conexión) ────────────────────────────────────── */
  var CLAVE_PEND = 'rcr-enc-pend-';
  var enCola = {};   // respuestas de esta visita que quedaron esperando conexión
  function pendientes() {
    try { return JSON.parse(localStorage.getItem(CLAVE_PEND + id) || '[]'); } catch (e) { return []; }
  }
  function guardarPend(lista) {
    try {
      if (lista.length) localStorage.setItem(CLAVE_PEND + id, JSON.stringify(lista));
      else localStorage.removeItem(CLAVE_PEND + id);
    } catch (e) { /* sin almacenamiento: solo se pierde el contador */ }
    pintarRed();
  }

  async function enviar(st) {
    if (enviando) return;
    /* Revisión final de todo (por si algo quedó en un paso anterior) */
    var err = validar(ENC.soloPreguntas(enc.preguntas), st);
    if (err) {
      var k = pags.findIndex(function (p) { return p.items.some(function (q) { return 'rq-' + q.id === err.id; }); });
      if (k >= 0 && k !== pagAct) irA(k, -1);
      setTimeout(function () { mostrarError(err); }, 60);
      return;
    }

    /* Solo se guardan las preguntas visibles y respondidas */
    var respuestas = {};
    ENC.soloPreguntas(enc.preguntas).forEach(function (q) {
      if (st.vis[q.id] && !vacio(st.r[q.id])) {
        respuestas[q.id] = q.tipo === 'numero' ? ENC.leerNumero(st.r[q.id]) : st.r[q.id];
      }
    });
    if (JSON.stringify(respuestas).length > ENC.LIMITE_DOC) {
      toast('Las fotos pesan demasiado. Quita alguna e inténtalo de nuevo.');
      return;
    }

    if (previa) { gracias('previa'); return; }

    enviando = true;
    var btn = document.getElementById('resp-enviar');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

    /* La respuesta queda en la cola de Firestore (en el teléfono) aunque no
       haya internet; se envía sola cuando vuelve la conexión. */
    var ref = db.collection(ENC.COL).doc(id).collection(ENC.SUB_RESP).doc();
    var escritura = ref.set({ respuestas: respuestas, enviado: firebase.firestore.FieldValue.serverTimestamp() });
    guardarPend(pendientes().concat([ref.id]));
    escritura.then(function () {
      guardarPend(pendientes().filter(function (x) { return x !== ref.id; }));
      /* Si había quedado en cola y ya no falta ninguna, se avisa */
      if (enCola[ref.id]) {
        delete enCola[ref.id];
        if (!Object.keys(enCola).length && !pendientes().length) toast('Listo: se enviaron las respuestas guardadas');
      }
    }, function (e) {
      console.error('responder-encuesta:', e);
      guardarPend(pendientes().filter(function (x) { return x !== ref.id; }));
    });

    var espera = navigator.onLine ? 9000 : 700;
    try {
      var res = await Promise.race([
        escritura.then(function () { return 'ok'; }),
        new Promise(function (ok) { setTimeout(function () { ok('cola'); }, espera); })
      ]);
      if (res === 'cola') enCola[ref.id] = true;
      gracias(res);
    } catch (e) {
      toast('No se pudo enviar: la encuesta puede estar cerrada. Inténtalo de nuevo.');
      btn.disabled = false;
      pintarProgreso();
    }
    enviando = false;
  }

  function gracias(modo) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    /* "Llenar otra" no recarga la página: así funciona igual sin conexión */
    var otra = '<button class="rg-btn rg-btn-pri resp-otra" onclick="window.__nuevaRespuesta()">' + ico('plus', 16, 2.4) + '<span>Llenar otra respuesta</span></button>';
    if (modo === 'previa') {
      estado('check', 'Vista previa completada', 'En el enlace real, aquí se habría guardado la respuesta.', otra, 'listo');
    } else if (modo === 'cola') {
      estado('clock', 'Respuesta guardada',
        persistente
          ? 'Se enviará automáticamente cuando haya conexión. Puedes llenar otra respuesta.'
          : 'Se enviará automáticamente cuando haya conexión. Deja esta página abierta hasta entonces.',
        otra, 'cola');
    } else {
      estado('check', '¡Gracias por responder!', 'Tu respuesta quedó registrada.', otra, 'listo');
    }
  }

  window.__nuevaRespuesta = function () {
    fotos = {};
    enviando = false;
    pintar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  /* ── Estado de la conexión y de lo que falta enviar ───────────────────── */
  /* Aviso de "sin conexión" arriba y, en la esquina, cuántas respuestas
     guardadas en este teléfono faltan por enviar */
  function pintarRed() {
    var sin = !navigator.onLine;
    var aviso = document.getElementById('rg-aviso');
    if (aviso) {
      document.getElementById('rg-aviso-ico').innerHTML = ico('alert', 16, 2.2);
      aviso.hidden = !sin || previa;
    }
    var n = pendientes().length;
    var cola = document.getElementById('rg-cola');
    if (!cola) return;
    cola.hidden = !n;
    if (!n) return;
    cola.classList.toggle('enviando', !sin);
    document.getElementById('rg-cola-ico').innerHTML = sin ? ico('upload', 20, 2.2) : '<span class="spinner"></span>';
    document.getElementById('rg-cola-n').textContent = n;
    var t = n + (n === 1 ? ' respuesta guardada' : ' respuestas guardadas') +
      (sin ? ' en este teléfono. Se enviarán automáticamente cuando haya conexión.' : '. Enviando…');
    cola.title = t;
    cola.setAttribute('aria-label', t);
  }
  document.getElementById('rg-cola').addEventListener('click', function () {
    var n = pendientes().length;
    toast(n + (n === 1 ? ' respuesta guardada' : ' respuestas guardadas') +
      (navigator.onLine ? ': se están enviando.' : ': se enviarán automáticamente cuando haya conexión.'));
  });
  window.addEventListener('online', function () {
    pintarRed();
    toast(pendientes().length ? 'Volvió la conexión: enviando las respuestas guardadas…' : 'Volvió la conexión');
    vigilarPendientes();
  });
  window.addEventListener('offline', function () { pintarRed(); });

  /* Respuestas guardadas sin conexión en visitas anteriores: Firestore las
     reenvía al abrir la página; cuando terminan se limpia el contador. */
  function vigilarPendientes() {
    if (!db || !pendientes().length || !db.waitForPendingWrites) return;
    db.waitForPendingWrites().then(function () {
      var n = pendientes().length;
      guardarPend([]);
      if (n) toast(n === 1 ? 'Se envió la respuesta pendiente' : 'Se enviaron ' + n + ' respuestas pendientes');
    }).catch(function () { /* se reintenta en la próxima visita */ });
  }

  /* ── Página disponible sin conexión ───────────────────────────────────── */
  if ('serviceWorker' in navigator && !previa && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw-encuestas.js', { scope: './' }).catch(function (e) {
      console.warn('sw-encuestas:', e);
    });
  }

  /* ── Arranque ─────────────────────────────────────────────────────────── */
  (async function () {
    var codigo = String(params.get('c') || '').trim().toLowerCase();
    if (!id && !ENC.esCodigo(codigo)) { estado('alert', 'Enlace incompleto', 'Pide que te reenvíen el enlace de la encuesta.'); return; }
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyB4-Agk4jG2HFMnvLQyB1q4vapZQ01Bh4o",
        authDomain: "redes-con-rostro.firebaseapp.com",
        projectId: "redes-con-rostro",
        storageBucket: "redes-con-rostro.firebasestorage.app",
        messagingSenderId: "138746747295",
        appId: "1:138746747295:web:1ceb9c60d4a4073e6885aa"
      });
      db = firebase.firestore();
      /* Guarda en el teléfono la encuesta y la cola de respuestas */
      try { await db.enablePersistence({ synchronizeTabs: true }); persistente = true; }
      catch (e) { console.warn('Sin persistencia sin conexión:', e && e.code); }

      /* Enlace corto (/e/?codigo): el código dice qué encuesta abrir */
      if (!id) {
        var cs = await db.collection(ENC.COL_COD).doc(codigo).get();
        if (!cs.exists || !cs.data().encuestaId) {
          estado('alert', 'Esta encuesta ya no está disponible', 'Revisa que el enlace esté completo o pide que te lo reenvíen.');
          return;
        }
        id = cs.data().encuestaId;
      }
      var snap = await db.collection(ENC.COL).doc(id).get();
      if (!snap.exists) { estado('alert', 'Esta encuesta ya no está disponible', 'Puede que la hayan eliminado.'); return; }
      enc = snap.data();
      document.title = (enc.titulo || 'Encuesta') + ' — Redes Con Rostro';
      /* Sin almacenamiento persistente, lo pendiente de visitas anteriores
         ya no existe: no se cuenta. */
      if (!persistente) guardarPend([]);
      pintarRed();
      vigilarPendientes();
      if (enc.estado === 'cerrada' && !previa) {
        estado('clock', enc.titulo || 'Encuesta', 'Esta encuesta ya no recibe respuestas.');
        return;
      }
      if (!ENC.soloPreguntas(enc.preguntas).length) { estado('inbox', enc.titulo || 'Encuesta', 'Esta encuesta todavía no tiene preguntas.'); return; }
      pintar();
    } catch (e) {
      console.error('responder-encuesta:', e);
      estado('alert', 'No se pudo abrir la encuesta',
        navigator.onLine ? 'Revisa tu conexión o pide que te reenvíen el enlace.'
          : 'Sin conexión: para usarla sin internet, primero ábrela una vez con conexión.');
    }
  })();
})();
</script>
