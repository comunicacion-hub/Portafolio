<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8f4fd">
<title>Mi RCR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Espacio de nombres: debe existir antes de que los módulos se registren -->
<script>window.RCR = { modulos: {} };</script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<!-- Base -->
<script src="icons.js"></script>
<script src="logos.js"></script>
<script src="pies.js"></script>
<script src="fondos.js"></script>
<script src="fuente.js"></script>
<script src="accesos.js"></script>

<!-- Módulos (el orden define el orden de la navegación) -->
<script src="semaforo.js"></script>
<script src="curriculum.js"></script>
<script src="informes.js"></script>
<script src="firmas.js"></script>
</head>

<body>

<!-- ══════════════════════════════════════════════════════════════════════
     VERIFICACIÓN DE SESIÓN
     ══════════════════════════════════════════════════════════════════════ -->
<div id="boot-screen">
  <div class="boot-spinner"></div>
  <div class="boot-txt">Verificando tu sesión</div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════
     ACCESO
     ══════════════════════════════════════════════════════════════════════ -->
<div id="login-screen" class="hidden">
  <div class="login-card">
    <div class="login-mark" id="login-mark">RCR</div>
    <h1>Mi RCR</h1>
    <p>Las herramientas del equipo de Redes Con Rostro, en un solo lugar.</p>
    <div class="login-hint">Entra con tu cuenta institucional</div>
    <div id="g-login-btn"></div>
    <div id="login-error" class="login-error hidden"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════
     APLICACIÓN
     ══════════════════════════════════════════════════════════════════════ -->
<div id="app-screen" class="hidden">

  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-titles">
        <h1 id="topbar-titulo">Mi RCR</h1>
        <span id="topbar-user">—</span>
      </div>
    </div>
    <div style="position:relative;">
      <button class="user-avatar" id="user-avatar" aria-label="Menú de usuario"
              aria-expanded="false" onclick="RCR.toggleMenu()">?</button>
      <div class="user-menu" id="user-menu" role="menu">
        <div class="user-menu-head">
          <strong id="menu-nombre">—</strong>
          <small id="menu-correo">—</small>
          <span class="rol-pill" id="menu-rol">—</span>
        </div>
        <button class="menu-item hidden" id="menu-accesos" role="menuitem"
                onclick="RCR.ir('accesos'); RCR.cerrarMenu();"></button>
        <button class="menu-item danger" role="menuitem" onclick="RCR.logout()"></button>
      </div>
    </div>
  </header>

  <main class="main" id="view"></main>

  <!-- Subvista nivel 2: pantalla completa para fichas (informe, CV) -->
  <section class="subvista hidden" id="subvista" aria-hidden="true">
    <header class="subvista-bar">
      <button class="subvista-back" id="subvista-back" aria-label="Volver">
        <span id="subvista-back-ico"></span>
      </button>
      <h2 id="subvista-titulo">—</h2>
    </header>
    <div class="subvista-body" id="subvista-body"></div>
  </section>

  <button class="fab hidden" id="fab" aria-label="Agregar"></button>

  <nav class="bottom-nav" aria-label="Secciones"><div class="nav-inner" id="nav"></div></nav>
</div>

<!-- Contenedor de modales dinámicos -->
<div id="modal-root"></div>

<!-- Confirmación -->
<div class="modal-overlay" id="m-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-titulo">
  <div class="confirm-modal">
    <div class="confirm-icon" id="confirm-icono"></div>
    <h3 id="confirm-titulo">¿Confirmar?</h3>
    <p id="confirm-texto">Esta acción no se puede deshacer.</p>
    <div class="confirm-btns">
      <button class="btn btn-glass" onclick="RCR.cerrarModal('m-confirm')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   HELPERS COMPARTIDOS
   ========================================================================== */

RCR.esc = function (v) {
  var d = document.createElement('div');
  d.textContent = (v === null || v === undefined) ? '' : String(v);
  return d.innerHTML;
};

var _toastTimer;
RCR.toast = function (msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
};

RCR.vacio = function (icono, titulo, sub) {
  return '<div class="empty-state">' +
           '<div class="e-ico">' + ico(icono || 'inbox', 24) + '</div>' +
           '<p>' + RCR.esc(titulo) + '</p>' +
           (sub ? '<small>' + RCR.esc(sub) + '</small>' : '') +
         '</div>';
};

RCR.cargando = function (texto) {
  return '<div class="empty-state">' +
           '<div class="e-ico"><span class="spinner dark"></span></div>' +
           '<p>' + RCR.esc(texto || 'Cargando') + '</p>' +
         '</div>';
};

/* ── Subvista nivel 2: ficha a pantalla completa (informe, CV) ───────────── */
RCR.subvista = function (o) {
  /* o = { titulo, cuerpo, onCerrar } */
  var sv   = document.getElementById('subvista');
  var body = document.getElementById('subvista-body');
  document.getElementById('subvista-titulo').textContent = o.titulo || '';
  document.getElementById('subvista-back-ico').innerHTML = ico('chevronLeft', 20, 2.4);
  body.innerHTML = o.cuerpo || '';

  var back = document.getElementById('subvista-back');
  RCR._subvistaCerrar = o.onCerrar || function () { RCR.cerrarSubvista(); };
  back.onclick = function () { RCR._subvistaCerrar(); };

  sv.classList.remove('hidden');
  sv.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(function () { sv.classList.add('open'); });
  body.scrollTop = 0;
  document.body.style.overflow = 'hidden';
};

RCR.cerrarSubvista = function () {
  var sv = document.getElementById('subvista');
  sv.classList.remove('open');
  sv.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  setTimeout(function () {
    sv.classList.add('hidden');
    document.getElementById('subvista-body').innerHTML = '';
  }, 200);
};

/* Modales dinámicos */
RCR.modal = function (o) {
  var prev = document.getElementById(o.id);
  if (prev) prev.remove();

  var wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.id = o.id;
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.innerHTML =
    '<div class="modal">' +
      '<div class="modal-handle"></div>' +
      '<div class="modal-header">' +
        '<h2>' + RCR.esc(o.titulo) + '</h2>' +
        (o.sub ? '<p>' + o.sub + '</p>' : '') +
        '<button class="modal-close" aria-label="Cerrar">' + ico('x', 16) + '</button>' +
      '</div>' +
      '<div class="modal-body">' + o.cuerpo + '</div>' +
      (o.acciones ? '<div class="modal-footer">' + o.acciones + '</div>' : '') +
    '</div>';

  document.getElementById('modal-root').appendChild(wrap);

  var cerrar = o.onCerrar || function () { RCR.cerrarModal(o.id); };
  wrap.querySelector('.modal-close').onclick = cerrar;

  /* Los formularios largos no se cierran al tocar fuera */
  if (!o.persistente) {
    wrap.addEventListener('click', function (e) { if (e.target === wrap) cerrar(); });
  }

  requestAnimationFrame(function () {
    wrap.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
};

RCR.cerrarModal = function (id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('open');
  if (id !== 'm-confirm') setTimeout(function () { el.remove(); }, 200);
  if (!document.querySelector('.modal-overlay.open')) document.body.style.overflow = '';
};

RCR.confirmar = function (o) {
  document.getElementById('confirm-icono').innerHTML = ico(o.icono || 'alert', 22);
  document.getElementById('confirm-titulo').textContent = o.titulo;
  document.getElementById('confirm-texto').innerHTML = o.texto;
  var ok = document.getElementById('confirm-ok');
  ok.textContent = o.label || 'Confirmar';
  ok.disabled = false;
  ok.setAttribute('onclick', o.onOk);
  document.getElementById('m-confirm').classList.add('open');
  document.body.style.overflow = 'hidden';
};

/* ── Carga de librerías a demanda (pdf-lib, pdf.js, jsPDF…) ─────────────── */
RCR._libs = {};
RCR.cargarLib = function (url) {
  if (RCR._libs[url]) return RCR._libs[url];
  RCR._libs[url] = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = res;
    s.onerror = function () { rej(new Error('No se pudo cargar ' + url)); };
    document.head.appendChild(s);
  });
  return RCR._libs[url];
};

/* ==========================================================================
   MENÚ DE USUARIO
   ========================================================================== */
RCR.toggleMenu = function () {
  var m = document.getElementById('user-menu');
  var abierto = m.classList.toggle('open');
  document.getElementById('user-avatar').setAttribute('aria-expanded', abierto ? 'true' : 'false');
};

RCR.cerrarMenu = function () {
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('user-avatar').setAttribute('aria-expanded', 'false');
};

document.addEventListener('click', function (e) {
  if (!e.target.closest('#user-avatar') && !e.target.closest('#user-menu')) RCR.cerrarMenu();
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-overlay.open').forEach(function (el) { RCR.cerrarModal(el.id); });
  RCR.cerrarMenu();
});

/* ==========================================================================
   NAVEGACIÓN ENTRE SECCIONES
   ========================================================================== */
RCR.activo = null;

RCR.visibles = function () {
  return Object.keys(RCR.modulos)
    .map(function (k) { return RCR.modulos[k]; })
    .filter(function (m) { return m.enNav && (!m.soloAdmin || RCR.esAdmin()); });
};

RCR.construirNav = function () {
  var nav = document.getElementById('nav');
  nav.innerHTML = RCR.visibles().map(function (m) {
    return '<button class="nav-btn" id="nav-' + m.id + '" onclick="RCR.ir(\'' + m.id + '\')">' +
             ico(m.icono, 21) + '<span>' + RCR.esc(m.titulo) + '</span>' +
           '</button>';
  }).join('');
};

RCR.ir = function (id) {
  var mod = RCR.modulos[id];
  if (!mod) return;
  if (mod.soloAdmin && !RCR.esAdmin()) { RCR.toast('Esta sección es solo para administradores'); return; }

  /* Ocultar la vista actual */
  document.querySelectorAll('#view > .vista').forEach(function (v) { v.classList.add('hidden'); });

  /* Crear la vista la primera vez */
  var vista = document.getElementById('vista-' + id);
  if (!vista) {
    vista = document.createElement('div');
    vista.className = 'vista';
    vista.id = 'vista-' + id;
    document.getElementById('view').appendChild(vista);
    mod.mount(vista);
  } else {
    if (mod.onShow) mod.onShow();
  }
  vista.classList.remove('hidden');

  /* Estado de la navegación */
  document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
  var btn = document.getElementById('nav-' + id);
  if (btn) btn.classList.add('active');

  document.getElementById('topbar-titulo').textContent = mod.titulo;

  /* FAB de la sección */
  var fab = document.getElementById('fab');
  if (mod.fab) {
    fab.innerHTML = ico(mod.fab.icono || 'plus', 24, 2.4);
    fab.setAttribute('aria-label', mod.fab.label || 'Agregar');
    fab.onclick = mod.fab.accion;
    fab.classList.remove('hidden');
  } else {
    fab.classList.add('hidden');
    fab.onclick = null;
  }

  RCR.activo = id;
  window.scrollTo({ top: 0, behavior: 'instant' });
};

/* ==========================================================================
   ENTRADA A LA APLICACIÓN
   ========================================================================== */
RCR.entrar = function () {
  document.getElementById('boot-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');


  document.getElementById('user-avatar').textContent = RCR.user.iniciales;
  document.getElementById('topbar-user').textContent = RCR.user.nombre;
  document.getElementById('menu-nombre').textContent = RCR.user.nombre;
  document.getElementById('menu-correo').textContent = RCR.user.correo;
  document.getElementById('menu-rol').textContent = RCR.user.rol;

  var mAcc = document.getElementById('menu-accesos');
  mAcc.innerHTML = ico('accesos', 15) + '<span>Accesos</span>';
  if (RCR.esAdmin()) mAcc.classList.remove('hidden');

  document.querySelector('.menu-item.danger').innerHTML = ico('logout', 15) + '<span>Cerrar sesión</span>';

  RCR.construirNav();
  var primera = RCR.visibles()[0];
  if (primera) {
    RCR.ir(primera.id);
  } else {
    document.getElementById('view').innerHTML =
      RCR.vacio('alert', 'No hay secciones disponibles', 'Escribe a comunicacion@redesconrostro.org.');
  }
};

RCR.mostrarLogin = function () {
  document.getElementById('boot-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');


  /* GSI carga en async: se espera con reintentos cortos */
  var intentos = 0;
  (function esperar() {
    if (RCR.initLogin()) return;
    if (++intentos > 30) return;                  // ~4.5 s
    RCR.loginError('');
    setTimeout(esperar, 150);
  })();
};

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
window.addEventListener('load', function () {
  try {
    RCR.initFirebase();
  } catch (e) {
    console.error('initFirebase:', e);
  }

  var sesion = RCR.leerSesion();
  if (sesion) {
    RCR.user = sesion;
    RCR.entrar();
  } else {
    RCR.mostrarLogin();
  }
});
</script>

<!--
  Mi RCR — notas técnicas
  ───────────────────────────────────────────────────────────────────────────
  · Acceso: Google OAuth restringido a @redesconrostro.org (accesos.js).
    RCR.EXIGIR_REGISTRO controla si además se pide estar dado de alta en la
    colección "Usuarios". Está en false hasta que esa colección esté completa.
  · Sesión: sessionStorage con clave propia "mircr_session" para no chocar con
    "rcr_session" de ReCircula, que vive en el mismo dominio de GitHub Pages.
  · La seguridad real vive en las Firestore Security Rules, no en el cliente:
    cada colaborador debe poder leer y escribir solo sus propios documentos.
  · Un módulo nuevo se agrega creando su archivo, registrándolo en
    RCR.modulos y sumando su <script> arriba.
-->
</body>
</html>
